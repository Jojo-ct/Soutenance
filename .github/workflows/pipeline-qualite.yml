name: Pipeline de Validation Qualité
on: [push]

jobs:
  validation-exigences:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # On règle le problème du warning ici
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # On passe à la version recommandée

      - name: Installer les outils
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npx playwright test

      # Cette étape va nous aider : elle enregistre une vidéo ou photo si ça rate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-erreur
          path: playwright-report/