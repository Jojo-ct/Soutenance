name: Pipeline de Validation Qualité
on: [push] # Se déclenche à chaque fois que tu envoies du code

jobs:
  validation-exigences:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les outils de test
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Lancer les tests de conformité
        run: npx playwright test
     